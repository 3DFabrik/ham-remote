<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HAM Remote</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <img src="/static/img/logo.svg" class="header-logo" alt="HAM Remote">
                <h1>HAM Remote</h1>
            </div>
            <div class="header-right">
                <span id="status-indicator" class="status-dot disconnected" title="Disconnected"></span>
                <span id="status-text">Offline</span>
            </div>
        </header>

        <!-- ========== LEVEL BARS (always visible, horizontal) ========== -->
        <section class="level-section">
            <!-- RF Signal -->
            <div class="level-row">
                <span class="level-name">RF</span>
                <div class="level-bar-track" id="rf-track">
                    <div class="level-bar-fill" id="smeter-bar-fill"></div>
                    <div class="level-bar-peak" id="smeter-peak"></div>
                    <div class="level-bar-clip" id="smeter-clip"></div>
                </div>
                <span class="level-bar-value" id="smeter-db">S0</span>
            </div>
            <!-- RX Audio -->
            <div class="level-row">
                <span class="level-name">RX</span>
                <div class="level-bar-track" id="rx-track">
                    <div class="level-bar-fill" id="rx-bar-fill"></div>
                    <div class="level-bar-peak" id="rx-peak"></div>
                    <div class="level-bar-clip" id="rx-clip"></div>
                </div>
                <span class="level-bar-value" id="rx-db">-∞ dB</span>
            </div>
            <!-- TX Audio -->
            <div class="level-row">
                <span class="level-name">TX</span>
                <div class="level-bar-track" id="tx-track">
                    <div class="level-bar-fill" id="tx-bar-fill"></div>
                    <div class="level-bar-peak" id="tx-peak"></div>
                    <div class="level-bar-clip" id="tx-clip"></div>
                </div>
                <span class="level-bar-value" id="tx-db">-∞ dB</span>
            </div>
        </section>

        <!-- Tabs -->
        <nav class="tabs">
            <button class="tab active" data-tab="main">📻 Main</button>
            <button class="tab" data-tab="setup">⚙️ Setup</button>
        </nav>

        <!-- ========== TAB: Main ========== -->
        <div class="tab-content active" id="tab-main">

            <!-- Frequency Display -->
            <section class="freq-section freq-compact">
                <!-- Digit UP buttons -->
                <div class="freq-digit-row" id="freq-digits-up">
                    <!-- Generated by JS -->
                </div>
                
                <!-- Digits with values -->
                <div class="freq-digit-row freq-digit-values" id="freq-digit-values">
                    <!-- Generated by JS -->
                </div>
                
                <!-- Digit DOWN buttons -->
                <div class="freq-digit-row" id="freq-digits-down">
                    <!-- Generated by JS -->
                </div>

            </section>

            <!-- Radio Controls -->
            <section class="controls-section">
                <div class="control-row">
                    <div class="control-group">
                        <label>Mode</label>
                        <div class="mode-buttons">
                            <button class="btn-mode active" data-mode="FM">FM</button>
                            <button class="btn-mode" data-mode="AM">AM</button>
                            <button class="btn-mode" data-mode="USB">USB</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Squelch</label>
                        <div class="stepper">
                            <button class="btn-step" id="sq-down">−</button>
                            <span id="sq-value">1</span>
                            <button class="btn-step" id="sq-up">+</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Volume</label>
                        <div class="stepper">
                            <button class="btn-step" id="vol-down">−</button>
                            <span id="vol-value">5</span>
                            <button class="btn-step" id="vol-up">+</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Power</label>
                        <button class="btn-toggle" id="power-toggle">LOW</button>
                    </div>
                </div>
            </section>

            <!-- Mic Enable + PTT -->
            <section class="ptt-section">
                <button class="btn-ptt" id="ptt-button">
                    <span class="ptt-label">PTT</span>
                    <span class="ptt-hint">Hold to talk</span>
                </button>
                <div class="mic-enable-bar">
                    <button class="btn-mic-toggle" id="btn-mic-enable">🎤 Enable Mic</button>
                    <span class="mic-status" id="mic-enable-status"></span>
                </div>
            </section>

        </div>

        <!-- ========== TAB: Setup ========== -->
        <div class="tab-content" id="tab-setup">

            <!-- Transceiver -->
            <section class="setup-section">
                <h3 class="setup-heading">📡 Transceiver</h3>
                <div class="setting-row">
                    <label>Type</label>
                    <select id="radio-type">
                        <option value="uvk5">Quansheng UV-K5</option>
                        <option value="yaesu-ft">Yaesu FT-7800/8300</option>
                        <option value="xiegu-x6100">Xiegu X6100</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Serial Port</label>
                    <select id="port-select">
                        <option value="">Auto-detect</option>
                    </select>
                    <button class="btn-small" id="btn-refresh-ports">🔄</button>
                </div>
                <div class="setting-row">
                    <button class="btn-connect" id="btn-connect">Connect</button>
                    <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
                </div>
            </section>

            <section class="setup-section">
                <h3 class="setup-heading">⌨️ PTT Hotkey</h3>
                <div class="setting-row">
                    <label>Taste</label>
                    <button class="btn-hotkey" id="ptt-hotkey-btn">Space</button>
                    <span class="hotkey-hint" id="hotkey-hint">Klicken dann Taste drücken</span>
                </div>
            </section>

            <!-- Audio -->
            <section class="setup-section">
                <h3 class="setup-heading">🎵 Audio</h3>
                <div class="setting-row">
                    <label>Playback</label>
                    <select id="audio-playback">
                        <option value="">Default</option>
                    </select>
                    <button class="btn-small" id="btn-refresh-audio">🔄</button>
                </div>
                <div class="setting-row">
                    <label>Capture</label>
                    <select id="audio-capture">
                        <option value="">Default</option>
                    </select>
                </div>
            </section>

        </div>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-text">Made by Norbot 🤖</span>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/opus-decoder.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
