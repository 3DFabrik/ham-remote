<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UV-K5 Remote</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo">📻</span>
                <h1>UV-K5 Remote</h1>
            </div>
            <div class="header-right">
                <span id="status-indicator" class="status-dot disconnected" title="Disconnected"></span>
                <span id="status-text">Offline</span>
            </div>
        </header>

        <!-- Frequency Display -->
        <section class="freq-section">
            <div class="freq-display">
                <div class="freq-mhz" id="freq-display">145.500</div>
                <div class="freq-unit">MHz</div>
            </div>
            <div class="freq-label" id="freq-label">2m FM</div>
            
            <!-- Frequency Controls -->
            <div class="freq-controls">
                <div class="freq-digits" id="freq-digits">
                    <!-- Digits will be generated by JS -->
                </div>
            </div>

            <!-- Quick frequency buttons -->
            <div class="quick-freqs">
                <button class="btn-freq" data-freq="144.800" title="DMR">D</button>
                <button class="btn-freq" data-freq="145.500" title="2m Calling">CQ</button>
                <button class="btn-freq" data-freq="145.375" title="Relais DB0Kö">R1</button>
                <button class="btn-freq" data-freq="145.575" title="Relais DB0OV">R2</button>
            </div>
        </section>

        <!-- Radio Controls -->
        <section class="controls-section">
            <div class="control-row">
                <div class="control-group">
                    <label>Squelch</label>
                    <div class="stepper">
                        <button class="btn-step" id="sq-down">−</button>
                        <span id="sq-value">1</span>
                        <button class="btn-step" id="sq-up">+</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Volume</label>
                    <div class="stepper">
                        <button class="btn-step" id="vol-down">−</button>
                        <span id="vol-value">5</span>
                        <button class="btn-step" id="vol-up">+</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Power</label>
                    <button class="btn-toggle" id="power-toggle">LOW</button>
                </div>
            </div>
        </section>

        <!-- PTT Button -->
        <section class="ptt-section">
            <button class="btn-ptt" id="ptt-button">
                <span class="ptt-label">PTT</span>
                <span class="ptt-hint">Hold to talk</span>
            </button>
        </section>

        <!-- Connection Settings (collapsible) -->
        <section class="settings-section">
            <button class="settings-toggle" id="settings-toggle">
                ⚙️ Settings
            </button>
            <div class="settings-panel" id="settings-panel" style="display:none;">
                <div class="setting-row">
                    <label>Serial Port</label>
                    <select id="port-select">
                        <option value="">Auto-detect</option>
                    </select>
                    <button class="btn-small" id="btn-refresh-ports">🔄</button>
                </div>
                <div class="setting-row">
                    <label>Simulation</label>
                    <input type="checkbox" id="simulate-toggle" checked>
                </div>
                <div class="setting-row">
                    <button class="btn-connect" id="btn-connect">Connect</button>
                    <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
                </div>
            </div>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
